<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<title>PicaPool Commute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF8F2;
    --teal:#093F3C;
    --orange:#FF7A33;
    --white:#FFFFFF;
    --beige:#F1ECDF;
    --soft-teal:#EAF2F1;
    --green:#218836;
    --muted:rgba(9,63,60,0.62);
    --border:rgba(9,63,60,0.10);
    /* Vertical rhythm is viewport-relative so a whole screen — question,
       answer AND the Next button — fits a phone without scrolling. On a
       tall phone these land on the old fixed values; on a short one they
       shrink instead of pushing the CTA below the fold. */
    --v-lg:clamp(10px,2.2vh,22px);
    --v-md:clamp(9px,1.7vh,18px);
    --v-sm:clamp(6px,1.2vh,12px);
  }

  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{background:var(--bg);}
  body{
    margin:0;
    color:var(--teal);
    background:var(--bg);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }

  h1,h2,h3,p{margin:0;}

  .stage{
    min-height:100vh;
    min-height:100dvh; /* 100vh on mobile is the URL-bar-less height, so it overflows */
    width:100%;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, #FDF6EA 0%, var(--bg) 55%);
  }

  .phone{
    width:100%;
    max-width:480px;
    min-height:100vh;
    min-height:100dvh;
    height:100dvh;
    overflow:hidden;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  @media (min-width:560px){
    .stage{padding:32px 16px;}
    .phone{
      min-height:min(860px, 92vh);
      height:min(860px, 92vh);
      height:min(860px, 92dvh);
      border-radius:28px;
      box-shadow: 0 1px 3px rgba(9,63,60,0.08), 0 30px 60px -24px rgba(9,63,60,0.35);
      border:1px solid var(--border);
      overflow:hidden;
    }
  }

  /* brand mark */
  .brandmark{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:var(--v-md) 22px 4px 22px;
  }
  .brandmark .word{
    font:700 17px/1 'Baloo 2',sans-serif;
    color:var(--teal);
    letter-spacing:.01em;
  }
  .brandmark .word b{color:var(--orange); font-weight:700;}
  .brandmark .stepcount{
    font:500 13px/1 'Inter',sans-serif;
    color:var(--muted);
  }

  /* progress */
  .progress-wrap{
    display:flex;
    gap:5px;
    padding:var(--v-sm) 22px 0 22px;
    flex-shrink:0;
  }
  .seg{
    height:5px;
    flex:1;
    border-radius:999px;
    background:var(--beige);
    overflow:hidden;
  }
  .seg i{
    display:block;
    height:100%;
    width:0%;
    background:var(--teal);
    border-radius:999px;
    transition:width .25s ease;
  }
  .seg.done i{width:100%;}
  .seg.active i{width:100%;}

  .screen-outer{
    flex:1;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }

  .screen{
    padding:var(--v-md) 22px 0 22px;
    display:flex;
    flex-direction:column;
    flex:1 0 auto;
    min-height:100%;
    animation: fadeSlide .28s ease;
  }

  @keyframes fadeSlide{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }

  .back-btn{
    align-self:flex-start;
    background:none;
    border:none;
    color:var(--muted);
    font:600 13px/1 'Inter',sans-serif;
    padding:6px 2px var(--v-sm) 2px;
    cursor:pointer;
  }
  .back-btn:hover{color:var(--teal);}
  .back-btn:focus-visible{outline:2px solid var(--orange); outline-offset:2px; border-radius:4px;}

  /* Purely a "push the CTA down when there IS room" spring. It must never
     add height of its own — that empty band in the middle is exactly what
     used to shove the Next button off the bottom of a phone screen. */
  .spacer{flex:1 1 auto; min-height:0;}

  /* Typography roles */
  .hero{
    font:800 clamp(29px,8.4vw,36px)/1.18 'Baloo 2',sans-serif;
    color:var(--teal);
    text-wrap:balance;
    margin-top:var(--v-sm);
    margin-bottom:var(--v-sm);
  }
  .question{
    font:800 clamp(23px,6.8vw,27px)/1.15 'Baloo 2',sans-serif;
    color:var(--teal);
    text-wrap:balance;
    margin-bottom:8px;
  }
  .helper{
    font:500 14px/1.45 'Inter',sans-serif;
    color:var(--muted);
    margin-bottom:var(--v-lg);
  }
  .mechanism{
    font:500 16.5px/1.5 'Inter',sans-serif;
    color:var(--muted);
    margin-bottom:8px;
    max-width:340px;
  }

  /* Page 1 hero illustration */
  .hero-illustration{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:var(--v-sm) 0;
    flex:0 1 auto;
    min-height:0;
  }
  /* capped by height as well as width: the drawing is 430x250, so bounding
     the width at 58vh keeps it under ~34vh tall on any phone and page 1
     stops being the screen that forces a scroll. */
  .hero-illustration svg{width:100%; height:auto; max-width:min(400px, 58vh); display:block;}

  /* Page 1 trust — compact soft-teal reassurance module */
  .trust-block{
    background:var(--soft-teal);
    border-radius:18px;
    padding:var(--v-md) 18px;
    margin-bottom:var(--v-sm);
    display:flex;
    gap:14px;
    align-items:flex-start;
  }
  .trust-icon{
    width:56px;
    height:56px;
    border-radius:14px;
    background:var(--white);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    flex-shrink:0;
    position:relative;
  }
  .trust-icon .spark{
    position:absolute;
    width:9px;
    height:2px;
    border-radius:2px;
    background:var(--orange);
  }
  .trust-icon .spark.s1{top:-3px; right:6px; transform:rotate(45deg);}
  .trust-icon .spark.s2{top:6px; right:-5px; transform:rotate(100deg);}
  .trust-body{flex:1; min-width:0;}
  .trust-title{
    font:700 16.5px/1.25 'Baloo 2',sans-serif;
    color:var(--teal);
    margin-bottom:4px;
  }
  .trust-sub{
    font:500 13.5px/1.4 'Inter',sans-serif;
    color:var(--muted);
    margin-bottom:var(--v-sm);
  }
  .verify-row{display:flex; flex-direction:column; gap:6px;}
  .verify-item{
    font:600 13.5px/1.3 'Inter',sans-serif;
    color:var(--teal);
    display:flex;
    align-items:center;
    gap:8px;
  }

  /* micro insight */
  .insight{
    display:flex;
    align-items:flex-start;
    gap:8px;
    font:600 13.5px/1.42 'Inter',sans-serif;
    color:var(--teal);
    margin:var(--v-lg) 0 4px 0;
  }
  .insight .ic{font-size:15px; line-height:1.42; flex-shrink:0;}
  .insight b{color:var(--orange); font-weight:700;}

  /* fields */
  .field{margin-bottom:var(--v-md);}
  .field label{
    display:block;
    font:600 13px/1 'Inter',sans-serif;
    color:var(--teal);
    margin-bottom:6px;
  }
  .field label .opt{
    color:var(--muted);
    font-weight:500;
    font-size:11.5px;
    margin-left:4px;
  }
  .field input{
    width:100%;
    min-height:clamp(44px,6vh,50px);
    border-radius:14px;
    border:1.5px solid var(--border);
    background:var(--white);
    font:500 16px/1.3 'Inter',sans-serif;
    color:var(--teal);
    padding:0 16px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input::placeholder{color:rgba(9,63,60,0.35);}
  .field input:focus{
    border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(9,63,60,0.10);
  }
  .field.err input{border-color:var(--orange);}
  .field .errmsg{
    display:none;
    font:600 12px/1.3 'Inter',sans-serif;
    color:var(--orange);
    margin-top:6px;
  }
  .field.err .errmsg{display:block;}

  .prefix-input{position:relative;}
  .prefix-input .prefix{
    position:absolute;
    left:16px; top:50%; transform:translateY(-50%);
    font:600 16px 'Inter',sans-serif;
    color:var(--teal);
    pointer-events:none;
  }
  .prefix-input input{padding-left:32px;}

  .chip-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin:10px 0 4px 0;
  }
  .chip{
    background:var(--beige);
    border:1px solid var(--border);
    color:var(--teal);
    font:600 13px/1 'Inter',sans-serif;
    padding:9px 13px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .chip:hover{border-color:var(--teal);}
  .chip.sel{
    background:var(--teal);
    border-color:var(--teal);
    color:var(--white);
  }

  .priv-block{margin:6px 0 var(--v-md) 0; padding:var(--v-sm) 16px; background:var(--soft-teal); border-radius:14px;}
  .priv-title{
    font:700 15.5px/1.3 'Baloo 2',sans-serif;
    color:var(--teal);
    margin-bottom:4px;
  }
  .priv-sub{
    font:500 12px/1.4 'Inter',sans-serif;
    color:var(--muted);
  }

  /* options */
  .options{
    display:flex;
    flex-direction:column;
    gap:clamp(7px,1.2vh,10px);
    margin-bottom:6px;
  }
  .option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--white);
    border:1.5px solid var(--border);
    border-radius:16px;
    padding:clamp(10px,1.5vh,14px) 16px;
    min-height:clamp(46px,6.2vh,52px);
    cursor:pointer;
    font:600 15.5px/1.3 'Inter',sans-serif;
    color:var(--teal);
    transition:border-color .15s ease, background .15s ease;
  }
  .option:hover{border-color:rgba(9,63,60,0.28);}
  .option .label{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  .option .oicon{
    font-size:17px;
    line-height:1;
    flex-shrink:0;
    width:22px;
    text-align:center;
  }
  .option .dot{
    width:20px;height:20px;
    border-radius:50%;
    border:2px solid var(--border);
    flex-shrink:0;
    position:relative;
    transition:border-color .15s ease;
  }
  .option .dot::after{
    content:'';
    position:absolute; inset:3px;
    border-radius:50%;
    background:var(--orange);
    transform:scale(0);
    transition:transform .15s ease;
  }
  .option.sel{
    border-color:var(--orange);
    background:#FFF6EF;
  }
  .option.sel .dot{border-color:var(--orange);}
  .option.sel .dot::after{transform:scale(1);}
  .option:focus-visible{outline:2px solid var(--orange); outline-offset:2px;}

  /* CTA — pinned to the bottom of the frame.
     The spacer above still places it naturally when the screen has room;
     sticky only matters on the rare screen (small phone, keyboard open,
     long answer list) that genuinely cannot fit, and there it keeps Next
     reachable without a scroll instead of hiding it below the fold. */
  .cta-area{
    margin-top:auto;
    padding-top:var(--v-lg);
    padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));
    position:sticky;
    bottom:0;
    z-index:3;
    background:linear-gradient(to bottom, rgba(251,248,242,0) 0%, var(--bg) 34%, var(--bg) 100%);
  }
  .btn{
    width:100%;
    min-height:52px;
    border-radius:15px;
    border:none;
    background:var(--orange);
    color:var(--white);
    font:700 16px/1 'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    box-shadow:0 10px 24px -10px rgba(255,122,51,0.55);
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn:active{transform:translateY(1px) scale(0.99);}
  .btn:focus-visible{outline:2px solid var(--teal); outline-offset:3px;}

  /* the bottom breathing room now lives inside the sticky .cta-area, so
     this stays in the markup as a no-op anchor (CTA injection targets it) */
  .safe-bottom{height:0;}
  /* ...except the confirmation screen, which has no CTA of its own */
  .screen:not(:has(.cta-area)){padding-bottom:var(--v-lg);}

  /* Page 8: shared-cab pitch */
  .pitch-line{
    font:500 15.5px/1.5 'Inter',sans-serif;
    color:var(--teal);
    margin-bottom:var(--v-md);
  }
  .pitch-strong{
    font:800 21px/1.25 'Baloo 2',sans-serif;
    color:var(--orange);
    margin:2px 0 var(--v-lg) 0;
  }
  .pitch-q{
    font:700 19px/1.25 'Baloo 2',sans-serif;
    color:var(--teal);
    margin:0 0 var(--v-sm) 0;
  }

  /* Page 9: confirmation */
  .celebrate{
    position:relative;
    height:78px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:6px 0 18px 0;
  }
  .celebrate .core{font-size:46px; line-height:1; position:relative; z-index:1;}
  .celebrate .dot{position:absolute; border-radius:50%;}
  .celebrate .d1{width:14px; height:14px; background:var(--orange); top:2px; left:calc(50% - 54px);}
  .celebrate .d2{width:9px; height:9px; background:var(--teal); top:10px; right:calc(50% - 58px);}
  .celebrate .d3{width:10px; height:10px; background:transparent; border:2px solid var(--orange); bottom:6px; left:calc(50% - 44px);}
  .celebrate .d4{width:8px; height:8px; background:var(--teal); bottom:0; right:calc(50% - 40px);}
  .celebrate .bar{position:absolute; width:14px; height:3px; border-radius:2px; background:var(--orange);}
  .celebrate .b1{top:18px; left:calc(50% + 36px); transform:rotate(-30deg);}
  .celebrate .b2{bottom:14px; right:calc(50% + 30px); transform:rotate(20deg); background:var(--teal);}
  .confirm-title{
    font:800 clamp(30px,8vw,36px)/1.12 'Baloo 2',sans-serif;
    color:var(--teal);
    margin-bottom:8px;
    text-align:center;
  }
  .confirm-sub{
    font:500 14.5px/1.4 'Inter',sans-serif;
    color:var(--muted);
    margin-bottom:28px;
    text-align:center;
  }
  .panel{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:14px;
    padding:15px 16px;
    margin-bottom:26px;
  }
  .panel-title{
    font:700 11px/1 'Inter',sans-serif;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:11px;
  }
  .detail-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    font:500 13px/1.5 'Inter',sans-serif;
    color:var(--muted);
    padding:2px 0;
  }
  .detail-row b{font-weight:600; color:var(--teal);}
  .panel-divider{
    height:1px;
    background:var(--border);
    margin:12px 0;
  }
  .commute-route{
    font:700 16.5px/1.3 'Baloo 2',sans-serif;
    color:var(--teal);
    margin-bottom:9px;
  }
  .commute-tags{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
  }
  .commute-tag{
    background:var(--beige);
    border:1px solid var(--border);
    color:var(--teal);
    font:600 12px/1 'Inter',sans-serif;
    padding:6px 10px;
    border-radius:999px;
  }
  .memorable{
    font:800 clamp(22px,6.2vw,26px)/1.25 'Baloo 2',sans-serif;
    color:var(--teal);
    margin:0 0 24px 0;
    text-wrap:balance;
  }
  .next-line-1{
    font:500 15px/1.5 'Inter',sans-serif;
    color:var(--teal);
    margin-bottom:8px;
  }
  .next-line-2{
    font:600 14.5px/1.5 'Inter',sans-serif;
    color:var(--muted);
    margin-bottom:26px;
  }
  .thanks{
    font:500 14px/1.5 'Inter',sans-serif;
    color:var(--muted);
  }

  .confetti{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:2;
  }
  .confetti span{
    position:absolute;
    top:-24px;
    font-size:16px;
    animation:fall 1.6s ease-in forwards;
    opacity:0;
  }
  @keyframes fall{
    0%{opacity:0; transform:translateY(0) rotate(0deg);}
    10%{opacity:1;}
    100%{opacity:0; transform:translateY(340px) rotate(160deg);}
  }

  /* multi-select variant: a square check that sits BEFORE the label, so the
     box lands on the left edge of the row instead of the far right. The
     round .dot above is left alone — pages 7 and 8 are still single-select. */
  .option.multi{justify-content:flex-start;}
  .option .box{
    width:20px;height:20px;
    border-radius:6px;
    border:2px solid var(--border);
    background:var(--white);
    flex-shrink:0;
    position:relative;
    transition:border-color .15s ease, background .15s ease;
  }
  .option .box::after{
    content:'';
    position:absolute;
    left:5px; top:2px;
    width:6px; height:11px;
    border:solid #FFFFFF;
    border-width:0 2.5px 2.5px 0;
    transform:rotate(45deg) scale(0);
    transform-origin:center;
    transition:transform .15s ease;
  }
  .option.sel .box{border-color:var(--orange); background:var(--orange);}
  .option.sel .box::after{transform:rotate(45deg) scale(1);}
</style>

<div class="stage">
  <div class="phone">
    <div class="brandmark" id="brandmark" hidden><span class="word">Pica<b>Pool</b></span><span class="stepcount">1 of 9</span></div>
    <div class="progress-wrap" id="progressWrap" role="progressbar" aria-label="Form progress"></div>
    <div class="screen-outer" id="screenOuter">
      <div class="screen" id="screen"></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var TOTAL_STEPS = 9;
  var METRO_STATIONS = [
    "Rithala","Rohini West","Rohini East","Pitampura","Kohat Enclave","Netaji Subhash Place",
    "Keshav Puram","Kanhaiya Nagar","Inderlok","Shastri Nagar","Tis Hazari","Pul Bangash",
    "Pratap Nagar","Shastri Park","Samaypur Badli","Rohini Sector 18-19","Haiderpur Badli Mor",
    "Jahangirpuri","Adarsh Nagar","Azadpur","Model Town",
    "Vidhan Sabha","Civil Lines","Kashmere Gate","Chandni Chowk","Chawri Bazar","New Delhi",
    "Rajiv Chowk","Patel Chowk","Central Secretariat","Shakurpur","Punjabi Bagh","ESI Hospital",
    "Rajouri Garden","Karol Bagh","Jhandewalan","Dwarka Sector 21","Majlis Park","Shalimar Bagh",
    "Welcome","Seelampur","Shahdara","Dilshad Garden",
    "Mundka","Nangloi","Udyog Nagar","Peeragarhi","Uttam Nagar East","Janakpuri West",
    "Noida Sector 15","Noida Sector 16","Botanical Garden","Vaishali","Kaushambi","Anand Vihar",
    "Laxmi Nagar","Mayur Vihar-I","Akshardham","Lajpat Nagar","Kalkaji Mandir","Saket",
    "Hauz Khas","Green Park","AIIMS","INA","Dhaula Kuan","Gurgaon"
  ];

  var state = {
    step: 1,
    data: {
      full_name:"",
      college:"",
      phone_number:"",
      email_optional:"",
      nearest_metro_station:"",
      travel_modes:[],
      daily_travel_spend:"",
      daily_one_way_travel_time:"",
      commute_feeling:"",
      shared_cab_interest:""
    },
    submitted:false
  };

  var dbNS = null;
  if (window.claude && typeof window.claude.use === "function"){
    window.claude.use("db").then(function(ns){ dbNS = ns; }).catch(function(){ dbNS = null; });
  }

  var screenEl = document.getElementById("screen");
  var screenOuterEl = document.getElementById("screenOuter");
  var progressWrap = document.getElementById("progressWrap");
  var brandmarkEl = document.getElementById("brandmark");

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* small perception-shifting insight line: icon optional */
  function insightHTML(text, icon){
    return '<div class="insight">' + (icon ? '<span class="ic">'+icon+'</span>' : '') + '<span>'+text+'</span></div>';
  }

  function renderProgress(){
    var html = "";
    for (var i=1;i<=TOTAL_STEPS;i++){
      var cls = "seg";
      if (i < state.step) cls += " done";
      else if (i === state.step) cls += " active";
      html += '<div class="'+cls+'"><i></i></div>';
    }

    var d = document.createElement("div");
    d.className = "inline-alert";
    d.style.cssText = "font:600 12.5px 'Inter',sans-serif;color:var(--orange);margin-top:8px;";
    d.textContent = msg;
    anchor.insertAdjacentElement("afterend", d);
    setTimeout(function(){ d.remove(); }, 2200);
  }

  var audioContext = null, audioUnavailable = false;
  function audio(){
    if (!ENABLE_SOUND || audioUnavailable) return null;
    if (!audioContext){
      try{
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx){ audioUnavailable = true; return null; }
        audioContext = new Ctx();
      }catch(e){ audioUnavailable = true; return null; }
    }
    // iOS starts every context suspended and only allows a resume inside a
    // real user gesture — which is exactly where every call site here is.
    if (audioContext.state === 'suspended'){ try{ audioContext.resume(); }catch(e){} }
    return audioContext;
  }
  function withAudio(play){ var ctx = audio(); if (!ctx) return; try{ play(ctx); }catch(e){} }

  /* one short sine with a fast decay — a soft "tick", never a buzz. Kept
     quiet on purpose: this plays on every tap. */
  function blip(freq, startAt, dur, peak){
    withAudio(function(ctx){
      var t = ctx.currentTime + (startAt || 0);
      var d = dur || 0.09;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(peak || 0.055, t + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + d);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + d + 0.02);
    });
  }
  function buzz(pattern){
    if (!ENABLE_HAPTICS) return;
    // iOS Safari has no Vibration API at all, so this is a no-op there
    // rather than an error.
    try{ if (navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
  }

  var SOUNDS = {
    select:  function(){ blip(880, 0, 0.07, 0.05); buzz(8); },
    advance: function(){ blip(660, 0, 0.07, 0.05); blip(988, 0.055, 0.09, 0.05); buzz(12); },
    back:    function(){ blip(494, 0, 0.08, 0.04); buzz(8); },
    finish:  function(){
      blip(659, 0,    0.10, 0.05);
      blip(880, 0.09, 0.10, 0.05);
      blip(1319, 0.18, 0.24, 0.05);
      buzz([12, 40, 12, 40, 20]);
    }
  };
  function feedback(kind){ try{ (SOUNDS[kind] || SOUNDS.select)(); }catch(e){} }

  /* One delegated listener in the capture phase, so a tap is heard even
     when the handler under it immediately re-renders or navigates away.
     Nothing existing had to be touched to wire this up. */
  var autoClicking = false;
  document.addEventListener('click', function(e){
    if (autoClicking) return; // programmatic advance; its own sound already played
    var t = (e.target && e.target.closest)
      ? e.target.closest('.back-btn, .option, .chip, .btn, [data-track-cta]')
      : null;
    if (!t) return;
    if (t.classList.contains('back-btn')) feedback('back');
    else if (t.classList.contains('option') || t.classList.contains('chip')) feedback('select');
    else if (t.id === 'p8next') return; // the finish flourish covers this one
    else feedback('advance');
  }, true);

  /* ---- auto-advance: OFF ----
     Turned off on 11 Sep 2026 — every screen waits for a deliberate press
     of Next, on request. The wiring below is left in place and gated by
     these two flags (same pattern as the CTA constants above): flip either
     back to true and the behaviour returns, with no other edit.
     Advancing by pressing the page's own Next button reuses that button's
     existing validation and state handling rather than duplicating it. */
  var AUTO_ADVANCE       = false;
  var AUTO_ADVANCE_CHIPS = false;
  var AUTO_ADVANCE_MAP = [
    // page 4 is deliberately absent: it is multi-select now, so advancing on
    // the first tap would make it impossible to pick a second mode
    { pick: '#feelOptions .option',     next: 'p7next', ms: 320 },
    { pick: '#interestOptions .option', next: 'p8next', ms: 380 },
    // chips get longer: tapping one reveals the "₹120/day is ₹3,120+ every
    // month" insight, and moving on before that lands wastes the whole point
    // of the screen. Typing a number still needs Next, by design.
    { pick: '#spendChips .chip',        next: 'p5next', ms: 900, chips: true },
    { pick: '#timeChips .chip',         next: 'p6next', ms: 900, chips: true }
  ];

  var autoAdvanceTimer = null;
  function bindAutoAdvance(){
    AUTO_ADVANCE_MAP.forEach(function(rule){
      // the listeners are still attached when the flags are off, because the
      // keydown one also carries the select sound for keyboard users
      var armed = AUTO_ADVANCE && (!rule.chips || AUTO_ADVANCE_CHIPS);
      document.querySelectorAll(rule.pick).forEach(function(el){
        if (el.getAttribute('data-auto-bound')) return;
        el.setAttribute('data-auto-bound','1');
        // bound after the page's own pick handler, so the answer is already
        // in state by the time this fires
        var go = function(){
          if (!armed) return;
          if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);
          autoAdvanceTimer = setTimeout(function(){
            var btn = document.getElementById(rule.next);
            if (!btn) return;
            autoClicking = true;
            try{ btn.click(); }finally{ autoClicking = false; }
          }, rule.ms);
        };
        el.addEventListener('click', go);
        // the existing keyboard handler calls pick() directly rather than
        // dispatching a click, so Enter/Space needs its own hook
        el.addEventListener('keydown', function(ev){
          if (ev.key === 'Enter' || ev.key === ' '){ feedback('select'); go(); }
        });
      });
    });
  }

  /* leaving a screen mid-advance shouldn't fire the old screen's Next */
  window.addEventListener('pagehide', function(){
    if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);
  });

  /* ---- wrap render(): one hook that catches the first paint AND every
     goto(), so no existing call site had to change ---- */
  var lastRenderedStep = null;
  var __ppRender = render;
  render = function(){
    if (REDIRECTING) return; // page is on its way to a shortlink destination
    __ppRender();
    state.maxStep = Math.max(state.maxStep || 1, state.step);
    logEvent(currentId(), 'view');
    if (state.step === TOTAL_STEPS){
      ensureReferralCode();
      injectFinalCTAs();
    }
    bindCtas();
    bindAutoAdvance();
    /* the flourish belongs to *arriving* at the last screen, not to
       re-rendering it, and not to a returning visitor who resumes straight
       onto it (no user gesture there, so the browser would block it anyway) */
    if (state.step === TOTAL_STEPS && lastRenderedStep !== null && lastRenderedStep !== TOTAL_STEPS){
      feedback('finish');
    }
    lastRenderedStep = state.step;
    /* The final screen must not wait on the 700ms debounce. The existing
       submitAndShowPage9() calls persistSubmission() BEFORE goto(9), so at
       that point state.step is still 8 — this is the only place that sends
       the row as 'complete'. */
    if (state.step === TOTAL_STEPS){ saveLocal(); flushProgress(); }
    else syncProgress();
  };

  /* completion should not wait on the 700ms debounce */
  var __ppPersist = persistSubmission;
  persistSubmission = function(){
    try{ __ppPersist(); }catch(e){}
    logEvent(currentId(), 'submit');
    saveLocal();
    flushProgress();
  };

  /* ---- initial visit log + resume ---- */
  var RESUMED = restoreLocal();
  trackSlugEvent(entrySlug, 'visit', { resumed: RESUMED, ref: incomingRef, entryStep: state.step });
  /* state.step now holds the restored screen, so the existing render()
     call below lands the returning user exactly where they left off. */

  render();
})();
</script>
